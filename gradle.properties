# JVM settings for the Gradle daemon. Do not remove -Xmx, it is needed for the
# KSP and resource compilation tasks. Sized to work on a normal dev laptop.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Dependency versions shared by all projects. Kept in gradle.properties (rather
# than a root project `ext`) so they no longer rely on the deprecated implicit
# lookup of extra properties defined by a parent project.
daggerVersion=2.60.1
roomVersion=2.8.5
fastadapterVersion=3.2.4@aar
# Must match the Kotlin compiler version that AGP ships with, see
# https://developer.android.com/build/migrate-to-built-in-kotlin
kspVersion=2.2.10-2.0.2

# Faster configuration, execution and incremental builds.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# AndroidX is enabled project-wide. Jetifier is still required because the
# swipe-to-refresh widget (com.github.omadahealth:swipy) is compiled against the
# legacy support library and there is no AndroidX release of it. Its bytecode only
# links a handful of android.support.v4.view.{ViewCompat,MotionEventCompat}
# statics, but those must be rewritten for the app to link. Jetifier is deprecated
# but still functional in AGP 9; drop it once TripsFragment/DeparturesActivity
# move to androidx.swiperefreshlayout (which does not support the BOTH direction
# used here).
android.useAndroidX=true
android.enableJetifier=true

kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official

# AGP 9's built-in Kotlin rejects kotlin.sourceSets, which is how the KSP Gradle
# plugin registers its generated sources. KSP support for built-in Kotlin is not
# in place yet, so relax the guard until it is.
# See https://github.com/google/ksp/issues/2615
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
